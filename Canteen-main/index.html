<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Modern Canteen - Login</title>
  <link rel="icon" href="images/logo1.png"> 
  <!-- Google Fonts: Poppins + Tapestry -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Tapestry&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .tapestry-regular {
      font-family: 'Tapestry', cursive;
      font-weight: 400;
      font-style: normal;
    }
    
    /* CSS Logo Styles */
    .custom-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .custom-logo:hover {
      transform: scale(1.02);
    }
    .logo-icon {
      position: relative;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2.5px solid var(--primary);
      animation: logoGlow 2s infinite alternate;
    }
    .logo-circle {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient);
      animation: logoPulse 2s infinite;
    }
    .logo-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      opacity: 0.95;
    }
    .logo-text-section {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .logo-main-text {
      font-family: 'Poppins', 'Georgia', serif;
      font-size: 22px;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }
    .logo-tagline {
      font-family: 'Poppins', 'Arial', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 2px;
    }
    @keyframes logoGlow {
      0% { box-shadow: 0 0 2px rgba(37, 99, 235, 0.3); border-color: var(--primary); }
      100% { box-shadow: 0 0 16px rgba(6, 182, 212, 0.5); border-color: #06B6D4; }
    }
    @keyframes logoPulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    
    .admin-link {
      margin-top: 20px;
      text-align: center;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }
    .admin-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .admin-link a:hover {
      opacity: 0.8;
      transform: translateX(2px);
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- CSS Logo -->
      <div class="custom-logo" onclick="window.location.href='home.html'">
        <div class="logo-icon">
          <div class="logo-ring"></div>
          <div class="logo-circle"></div>
          <div class="logo-dot"></div>
          <div class="logo-line-left"></div>
          <div class="logo-line-right"></div>
          <div class="logo-line-top"></div>
        </div>
        <div class="logo-text-section">
          <span class="logo-main-text">The Panesh Kitchen</span>
          <span class="logo-tagline">Authentic Indian Taste</span>
        </div>
      </div>
      
      <div class="auth-header">
        <div class="auth-logo tapestry-regular"></div>
        <h1>Welcome Back!</h1>
        <p>Login to your account</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <p id="login-error" class="error-message"></p>

        <button type="submit" class="btn btn-primary full-width">Login</button>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
          <p><a href="home.html">Continue as Guest →</a></p>
        </div>

        <div class="admin-link">
          <a href="admin.html">👑 Admin Portal →</a>
        </div>
      </form>
      
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
