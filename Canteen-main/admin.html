<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Panesh Kitchen</title>
  <link rel="icon" href="images/logo1.png"> 
  <!-- Updated Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Tapestry&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .tapestry-regular {
      font-family: 'Tapestry', cursive;
      font-weight: 400;
      font-style: normal;
    }
    
    /* CSS Logo Styles */
    .custom-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .logo-icon {
      position: relative;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2.5px solid var(--primary);
      animation: logoGlow 2s infinite alternate;
    }
    .logo-circle {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient);
      animation: logoPulse 2s infinite;
    }
    .logo-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      opacity: 0.95;
    }
    .logo-text-section {
      display: flex;
      flex-direction: column;
      text-align: left;

    }
    .logo-main-text {
      font-family: 'Poppins', 'Georgia', serif;
      font-size: 22px;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }
    .logo-tagline {
      font-family: 'Poppins', 'Arial', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 5px;
    }
    @keyframes logoGlow {
      0% { box-shadow: 0 0 2px rgba(37, 99, 235, 0.3); border-color: var(--primary); }
      100% { box-shadow: 0 0 16px rgba(6, 182, 212, 0.5); border-color: #06B6D4; }
    }
    @keyframes logoPulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    
    .admin-login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 900px 500px at top center, rgba(37,99,235,0.10), transparent), linear-gradient(135deg, #1e2a3b 0%, #0f172a 100%);
      padding: 20px;
    }
    .admin-login-card {
      background: var(--card);
      border-radius: var(--radius-xl);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
    }
    .admin-login-card h2 {
      text-align: center;
      margin-bottom: 30px;
      font-family: var(--font-head);
    }
    .admin-logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="admin-login-container">
    <div class="admin-login-card">
      <!-- CSS Logo Added -->
      <div class="custom-logo" onclick="window.location.href='home.html'">
        <div class="logo-icon">
          <div class="logo-ring"></div>
          <div class="logo-circle"></div>
          <div class="logo-dot"></div>
          <div class="logo-line-left"></div>
          <div class="logo-line-right"></div>
          <div class="logo-line-top"></div>
        </div>
        <div class="logo-text-section">
          <span class="logo-main-text">The Panesh Kitchen</span>
          <span class="logo-tagline">Authentic Indian Taste</span>
        </div>
      </div>
      <h2 class="tapestry-regular">Admin Portal</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="admin-username" placeholder="owner@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-password" placeholder="Enter password" required>
        </div>
        <p id="admin-error" class="error-message"></p>
        <button type="submit" class="btn btn-primary full-width">Login</button>
      </form>
      <div class="auth-footer" style="margin-top: 20px;">
        <p><a href="home.html">← Back to Customer Site</a></p>
      </div>
    </div>
  </div>
  <script src="app-config.js"></script>
  <script src="panesh-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-auth.js"></script>
</body>
</html>
